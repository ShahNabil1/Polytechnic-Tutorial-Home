name = "pth-steadfast"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# Non-secret defaults. Override per-env via `wrangler secret put` (see README).
[vars]
STEADFAST_BASE_URL = "https://portal.packzy.com/api/v1"
ALLOWED_ORIGINS = "https://polytechnictutorial.com,https://www.polytechnictutorial.com,https://polyverse-learn-shop.lovable.app"

# Secrets (set with `wrangler secret put <NAME>`):
#   STEADFAST_API_KEY          — from Steadfast dashboard
#   STEADFAST_SECRET_KEY       — from Steadfast dashboard
#   STEADFAST_WEBHOOK_SECRET   — you invent, paste same value in Steadfast dashboard webhook config
#   STEADFAST_WORKER_HMAC_SECRET        — must match STEADFAST_WORKER_HMAC_SECRET in Lovable project secrets
#   SUPABASE_URL               — same as Lovable
#   SUPABASE_SERVICE_ROLE_KEY  — from Supabase dashboard (NEVER put in Lovable client code)
